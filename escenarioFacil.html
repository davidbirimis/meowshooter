<html>

    <head>

        <!-- Para detectar tildes -->
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" /> 

        <!-- Para que se vea bien en dispositivos móviles -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 

        <!-- Descripción de la página -->
        <meta name="description" content="Videojuego de David Pedrosa Azor" /> 

        <!-- Lenguaje de la página -->
        <meta lang="es" />

        <link rel="preload" href="img/escenario/finalScreen.jpg" as="image">

        <!-- Link CSS -->
        <link rel="stylesheet" href="css\escenario.css" />

        <link rel="icon" href="img/escenario/gato.webp" type="image/x-icon">

        <!-- Titulo de la página-->
        <title>Meow Shooter</title>

        <script>

            // Variable global para indicar que el juego ha terminado y bloquear eventos de teclado
            // Se inicializa en false porque al empezar el juego, los eventos de teclado deben funcionar normalmente  
            let juegoFinalizado = false; 

            document.addEventListener('keydown', function(event){

                // Cada vez que el usuario presiona una tecla, el código verifica si la variable juegoFinalizado es true.  
                // Si es true → Se detiene la ejecución y no se ejecuta ningún código dentro del switch.  
                // Si es false → El código sigue funcionando normalmente.  
                if (juegoFinalizado == true) return; // return -> sale de la función y evita que se ejecute el código que viene despué

                const teclaPresionada = event.key;
                
                switch(teclaPresionada){
                    case "ArrowUp":
                        moverElementoArriba();
                        break;
                    case "ArrowDown":
                        moverElementoAbajo();
                        break;
                    case "+":
                        incrementarContadorInput();
                        break;
                    case "-":
                        restarContadorInput();
                        break;
                    case " ":
                        aparecerObjetivo();
                        break;
                    case "Enter":
                        lanzarProyectil();
                        break;
                }
            });

            function moverElementoArriba(){

                const personajeGato = document.getElementById("personajeGato");
                const elementoB = document.getElementById("elementoB");

                const padreMarcadoresAltura = document.getElementById("padreElementosByC").offsetHeight;

                let posicionTop = personajeGato.offsetTop;
                
                let valorInput = parseInt(elementoB.innerHTML);

                personajeGato.style.backgroundImage = "url('img/escenario/gatoRun.webp')";

                posicionTop = posicionTop - valorInput;

                if(posicionTop < padreMarcadoresAltura){
                    personajeGato.style.top = padreMarcadoresAltura;
                } else {
                    personajeGato.style.top = posicionTop + "px";  
                }
            }

            function moverElementoAbajo(){

                const personajeGato = document.getElementById("personajeGato");
                const elementoB = document.getElementById("elementoB");

                const finalizarJuegoX = document.getElementById("divFinalizarJuego").offsetHeight;

                let posicionTop = personajeGato.offsetTop;

                let valorInput = parseInt(elementoB.innerHTML);

                personajeGato.style.backgroundImage = "url('img/escenario/gatoRun.webp')";

                posicionTop = posicionTop + valorInput;

                if(posicionTop + personajeGato.offsetHeight >= window.innerHeight - finalizarJuegoX){
                    personajeGato.style.top = window.innerHeight - personajeGato.offsetHeight - finalizarJuegoX;
                } else {
                    personajeGato.style.top = posicionTop + "px";
                }
            }
            
            function incrementarContadorInput(){
                
                const elementoB = document.getElementById("elementoB");
                const elementoBValor = parseInt(elementoB.innerHTML);

                elementoB.innerHTML = elementoBValor + 1;
            }

            function restarContadorInput(){
                
                const elementoB = document.getElementById("elementoB");
                const elementoBValor = parseInt(elementoB.innerHTML);

                if (elementoBValor > 0){
                    elementoB.innerHTML = elementoBValor - 1;
                } 
            }

            function aparecerObjetivo(){

                const personajeGato = document.getElementById("personajeGato");
                const finalizarJuegoX = document.getElementById("divFinalizarJuego");

                const objetivo = document.getElementById("objetivoRaton");

                // Para que el limite sea el contenedor superior
                const padreMarcadores = document.getElementById("padreElementosByC");
                
                let minLeft = window.innerWidth / 2;
                let maxLeft = window.innerWidth - objetivo.offsetWidth;
                let minTop = padreMarcadores.offsetHeight + personajeGato.offsetHeight / 2; // Top minimo altura padreMarcadores
                let maxTop = window.innerHeight - objetivo.offsetHeight - finalizarJuegoX.offsetHeight - personajeGato.offsetHeight / 2;

                let valorLeft = Math.floor(Math.random() * (maxLeft - minLeft + 1)) + minLeft;
                let valorTop = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;

                objetivo.style.left = valorLeft + "px";
                objetivo.style.top = valorTop + "px";

                objetivo.style.backgroundImage = "url('img/escenario/raton.gif')"; 

                objetivo.style.display = "block";
            }

            async function lanzarProyectil() {

                const proyectil = document.getElementById("proyectilBolaPelo");
                const personajeGato = document.getElementById("personajeGato");
                const alturaDisparo = personajeGato.offsetTop + personajeGato.offsetHeight / 2;
                const inicio = Date.now();

                const marcador = document.getElementById("marcadorPuntuaje");

                // Ejecutar el sonido de lanzamiento antes de mostrar el proyectil
                efectoSonidoLanzamiento();
              
                // Colocar el proyectil a la altura de disparo y hacer que aparezca
                proyectil.style.top = alturaDisparo;
                proyectil.style.display = "block";
                

                // Bucle que mueve el proyectil hacia la derecha mientras no haya impacto y no llegue al final
                while ((proyectil.offsetLeft < window.innerWidth - proyectil.offsetWidth) && (controlarImpactoProyectil() == false)){
                    proyectil.style.left = proyectil.offsetLeft + 4 + "px";
                    await new Promise(resolve => setTimeout(resolve, 1)); 
                }

                if (controlarImpactoProyectil() == true){
                    actualizarMarcador(5); 
                    reaparecerObjetivo(); // Llamar a la función para reaparecer el objetivo si hubo impacto
                } else {
                    proyectil.style.display = "none";
                    actualizarMarcador(-5);  
                }

                // Despues de que todo termine volver a la posicion default
                proyectil.style.left = personajeGato.offsetLeft + personajeGato.offsetWidth; 
                proyectil.style.top = alturaDisparo; 
                proyectil.style.display = "none";
            }

            function actualizarMarcador (numeroIncremento){

                const marcador = document.getElementById("marcadorPuntuaje");
                marcador.innerHTML = parseInt(marcador.innerHTML) + numeroIncremento;    
            }

           function controlarImpactoProyectil(){

                const proyectil = document.getElementById("proyectilBolaPelo");
                const objetivo = document.getElementById("objetivoRaton");

                if (proyectil.offsetTop >= objetivo.offsetTop - proyectil.offsetHeight && 
                    proyectil.offsetTop <= objetivo.offsetTop + objetivo.offsetHeight && 
                    proyectil.offsetLeft >= objetivo.offsetLeft - proyectil.offsetWidth && 
                    proyectil.offsetLeft <= objetivo.offsetLeft + objetivo.offsetWidth)
                {
                    efectoSonidoImpacto();  // Reproducir el sonido de impacto
                    objetivo.style.backgroundImage = "url('img/escenario/Preview.gif')";
                    return true;
                } else { 
                    return false; 
                }
            }

            // Funcion para volver a reaparecer el objetivo una vez impactado
            function reaparecerObjetivo() {

                // Usar un pequeño retraso antes de volver a mostrar el objetivo
                setTimeout(() => {
                    aparecerObjetivo();
                }, 460); // 460 ms de retraso
            }

            // Funciones para Activar/Desactivar Musica 
            function activarMusica() {

                const musicaFondo = new Audio('mp3/musicaFondoEscenario.mp3'); 

                // Guardar la música dentro del botón de música, para poder usarla después se necesite
                document.getElementById("divMusica").atributoMusicaFondo = musicaFondo;

                musicaFondo.loop = true;  
                musicaFondo.muted = false; // Se activa el sonido
                musicaFondo.volume = 0.3;  // Reducir volumen al 30%
                musicaFondo.play();

                // Mostrar botón de sonido y ocultar botón de mute
                document.getElementById("divMuted").style.display = "none"; 
                document.getElementById("divMusica").style.display = "block"; 
            }

            function desactivarMusica() {
                
                // Conseguir la música guardada anteriormente en el botón
                const musicaFondo = document.getElementById("divMusica").atributoMusicaFondo;
                musicaFondo.muted = true; // Silenciar la música 

                document.getElementById("divMusica").style.display = "none"; 
                document.getElementById("divMuted").style.display = "block"; 
            }

            // Efectos de sonido de disparo y Lanzamiento
            function efectoSonidoImpacto() {

                const impactoSonido = new Audio('mp3/impacto_sonido_hitmarker_objetivo.mp3'); 

                impactoSonido.play();
            }

            function efectoSonidoLanzamiento(){

                const sonidoDisparo = new Audio('mp3/woosh.mp3'); 

                sonidoDisparo.play();
            }


            // Funcion Final para Finalizar el Juego y ocultar todo en pantalla
            function finalizarJuego() {

                juegoFinalizado = true; // Bloquea los eventos del teclado

                document.getElementById("personajeGato").style.display = "none";
                document.getElementById("objetivoRaton").style.display = "none";

                document.getElementById("maderaVelocidad").style.display = "none";
                document.getElementById("elementoB").style.display = "none";

                document.getElementById("maderaPuntuaje").style.display = "none";
                document.getElementById("marcadorPuntuaje").style.display = "none";

                document.getElementById("divMusica").style.display = "none"; 
                document.getElementById("divMuted").style.display = "none"; 

                document.getElementById("divFinalizarJuego").style.display = "none";

                document.body.style.backgroundImage = "url('img/escenario/finalScreen2.jpg')";

                document.getElementById("invisibleFinJuego").style.display = "flex";

                document.getElementById("maderaFinalJuegoPuntos").style.display = "flex";

                const mensajeFinal = document.getElementById("mensajeFinalizarJuego");
                mensajeFinal.style.display = "block"; 
                mensajeFinal.innerHTML = marcadorPuntuaje.innerHTML;
            }

        </script>

    </head>

    <body>

        <div id="padreElementosByC">

            <div id="marcadorVida"></div>

            <div id="maderaVelocidad">
                <div id="elementoB">10</div>
            </div>

            <div id="maderaPuntuaje">
                <div id="marcadorPuntuaje">0</div>
            </div>

        </div>

        <div id="personajeGato"></div>
        <div id="proyectilBolaPelo"></div>
        <div id="objetivoRaton"></div>
        <div id="explosionGif"></div>

        <div id="divMusica" onclick="desactivarMusica()"></div>
        <div id="divMuted" onclick="activarMusica()"></div>

        <div id="divFinalizarJuego" onclick="finalizarJuego()"></div>
        
        <div id="invisibleFinJuego">
            <div id="maderaFinalJuegoPuntos">        
                <div id="mensajeFinalizarJuego"></div>
            </div>
        </div>
    </body>

</html>
