<html>

    <head>

        <!-- Para detectar tildes -->
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" /> 

        <!-- Para que se vea bien en dispositivos móviles -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 

        <!-- Descripción de la página -->
        <meta name="description" content="Videojuego de David Pedrosa Azor" /> 

        <!-- Lenguaje de la página -->
        <meta lang="es" />

        <!-- Link CSS -->
        <link rel="stylesheet" href="css\escenario.css" />

        <link rel="icon" href="img/escenario/gato.webp" type="image/x-icon">

        <!-- Titulo de la página-->
        <title>Meow Shooter</title>

        <script>

            document.addEventListener('keydown', function(event){

                const teclaPresionada = event.key;
                
                switch(teclaPresionada){
                    case "ArrowUp":
                        moverElementoArriba();
                        break;
                    case "ArrowDown":
                        moverElementoAbajo();
                        break;
                    case "+":
                        incrementarContadorInput();
                        break;
                    case "-":
                        restarContadorInput();
                        break;
                    case " ":
                        aparecerObjetivo();
                        break;
                    case "Enter":
                        lanzarProyectil();
                        break;
                }
            });

            function moverElementoArriba(){

                const personajeGato = document.getElementById("personajeGato");
                const elementoB = document.getElementById("elementoB");

                let posicionTop = personajeGato.offsetTop;
                
                let valorInput = parseInt(elementoB.innerHTML);

                posicionTop = posicionTop - valorInput;

                if(posicionTop < 0){
                    personajeGato.style.top = "0px";
                } else {
                    personajeGato.style.top = posicionTop + "px";  
                }
            }

            function moverElementoAbajo(){

                const personajeGato = document.getElementById("personajeGato");
                const elementoB = document.getElementById("elementoB");

                let posicionTop = personajeGato.offsetTop;

                let valorInput = parseInt(elementoB.innerHTML);

                posicionTop = posicionTop + valorInput;

                if(posicionTop + personajeGato.offsetHeight >= window.innerHeight){
                    personajeGato.style.top = window.innerHeight - personajeGato.offsetHeight;
                } else {
                    personajeGato.style.top = posicionTop + "px";
                }
            }
            
            function incrementarContadorInput(){
                
                const elementoB = document.getElementById("elementoB");
                const elementoBValor = parseInt(elementoB.innerHTML);

                elementoB.innerHTML = elementoBValor + 1;
            }

            function restarContadorInput(){
                
                const elementoB = document.getElementById("elementoB");
                const elementoBValor = parseInt(elementoB.innerHTML);

                if (elementoBValor > 0){
                    elementoB.innerHTML = elementoBValor - 1;
                } 
            }

            function aparecerObjetivo(){

                const objetivo = document.getElementById("objetivoRaton");

                let minLeft = window.innerWidth / 2;
                let maxLeft = window.innerWidth - objetivo.offsetWidth;
                let minTop = 0;
                let maxTop = window.innerHeight - objetivo.offsetHeight;

                let valorLeft = Math.floor(Math.random() * (maxLeft - minLeft + 1)) + minLeft;
                let valorTop = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;

                objetivo.style.left = valorLeft + "px";
                objetivo.style.top = valorTop + "px";

                objetivo.style.backgroundImage = "url('img/escenario/raton.gif')"; 

                objetivo.style.display = "block";
            }

            async function lanzarProyectil() {

                const proyectil = document.getElementById("proyectilBolaPelo");
                const personajeGato = document.getElementById("personajeGato");
                const alturaDisparo = personajeGato.offsetTop + 60 + "px";
                const inicio = Date.now();

                const marcador = document.getElementById("marcadorPuntuaje");

                // Ejecutar el sonido de lanzamiento antes de mostrar el proyectil
                efectoSonidoLanzamiento();
              
                // Colocar el proyectil a la altura de disparo y hacer que aparezca
                proyectil.style.top = alturaDisparo;
                proyectil.style.display = "block";

                // Bucle que mueve el proyectil hacia la derecha mientras no haya impacto y no llegue al final
                while ((proyectil.offsetLeft < window.innerWidth - proyectil.offsetWidth) && (controlarImpactoProyectil() == false)){
                    proyectil.style.left = proyectil.offsetLeft + 4 + "px";
                    await new Promise(resolve => setTimeout(resolve, 1)); 
                }

                if (controlarImpactoProyectil() == true){
                    actualizarMarcador(5); 
                } else {
                    proyectil.style.display = "none";
                    actualizarMarcador(-10);  
                }

                // Despues de que todo termine volver a la posicion default
                proyectil.style.left = personajeGato.offsetLeft + personajeGato.offsetWidth; 
                proyectil.style.top = alturaDisparo; 
                proyectil.style.display = "none";
            }

            function actualizarMarcador (numeroIncremento){

                const marcador = document.getElementById("marcadorPuntuaje");
                marcador.innerHTML = parseInt(marcador.innerHTML) + numeroIncremento;    
            }

           function controlarImpactoProyectil(){

                const proyectil = document.getElementById("proyectilBolaPelo");
                const objetivo = document.getElementById("objetivoRaton");

                if (proyectil.offsetTop >= objetivo.offsetTop - proyectil.offsetHeight && proyectil.offsetTop <= objetivo.offsetTop + objetivo.offsetHeight && proyectil.offsetLeft >= objetivo.offsetLeft - proyectil.offsetWidth && proyectil.offsetLeft <= objetivo.offsetLeft + objetivo.offsetWidth){
                    efectoSonidoImpacto();  // Reproducir el sonido de impacto
                    objetivo.style.backgroundImage = "url('img/escenario/Preview.gif')";
                    return true;
                } else { 
                    return false; 
                }
            }

            // Funciones para Activar/Desactivar Musica 
            function activarMusica() {

                const musicaFondo = new Audio('mp3/musicaFondoEscenario.mp3'); 
                musicaFondo.loop = true;  
                musicaFondo.muted = false; // Se activa el sonido
                musicaFondo.volume = 0.3;  // Reducir volumen al 30%
                musicaFondo.play();

                // Guardar en un atributo del botón para poder acceder después
                document.getElementById("divMusica").musicaFondo = musicaFondo;

                // Mostrar botón de sonido y ocultar botón de mute
                document.getElementById("divMuted").style.display = "none"; 
                document.getElementById("divMusica").style.display = "block"; 
            }

            function desactivarMusica() {
                
                const musicaFondo = document.getElementById("divMusica").musicaFondo;
                musicaFondo.muted = true; // Silenciar la música directamente

                document.getElementById("divMusica").style.display = "none"; 
                document.getElementById("divMuted").style.display = "block"; 
            }

            // Efectos de sonido de disparo y Lanzamiento
            function efectoSonidoImpacto() {

                const impactoSonido = new Audio('mp3/impacto_sonido_hitmarker_objetivo.mp3'); 

                impactoSonido.play();
            }

            function efectoSonidoLanzamiento(){

                const sonidoDisparo = new Audio('mp3/woosh.mp3'); 

                sonidoDisparo.play();
            }

            // Funcion Final para Finalizar el Juego y ocultar todo en pantalla
            function finalizarJuego(){

                const personajeGato = document.getElementById("personajeGato");
                const contador = document.getElementById("elementoB");
                const marcador = document.getElementById("marcadorPuntuaje");
                const objetivo = document.getElementById("objetivoRaton");
                const divFinalizarJuego = document.getElementById("divFinalizarJuego");

                const mensajeFinal = document.getElementById("mensajeFinalizarJuego");

                document.body.style.backgroundImage = "none";
                personajeGato.style.display = "none";
                contador.style.display = "none";
                marcador.style.display = "none";
                objetivo.style.display = "none";
                document.getElementById("divMusica").style.display = "none"; 
                document.getElementById("divMuted").style.display = "none"; 
                divFinalizarJuego.style.display = "none";

                mensajeFinal.style.display = "block";
                mensajeFinal.innerHTML = "JUEGO FINALIZADO, TU PUNTUACION ES " + marcador.innerHTML;
            }

        </script>

    </head>

    <body>

        <div id="padreElementosByC">

            <div id="marcadorVelocidad">
                <div id="elementoB">10</div>
            </div>

            <div id="marcadorPuntos">
                <div id="marcadorPuntuaje">0</div>
            <div>

        </div>

        <div id="personajeGato"></div>
        <div id="proyectilBolaPelo"></div>
        <div id="objetivoRaton"></div>
        <div id="explosionGif"></div>

        <div id="divMusica" onclick="desactivarMusica()"></div>
        <div id="divMuted" onclick="activarMusica()"></div>

        <div id="divFinalizarJuego" onclick="finalizarJuego()"></div>
        <div id="mensajeFinalizarJuego"></div>


    </body>

</html>
